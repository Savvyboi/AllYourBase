repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: Mypy
        entry: uv run --extra access --extra ingestion --extra review --extra monitor mypy src tests
        language: system
        pass_filenames: false
        types: [python]
      - id: catalogue
        name: Settings and catalogue integrity
        entry: uv run allyourbase catalogue check
        language: system
        pass_filenames: false
        files: ^(catalogue/|config/|src/)
      - id: schemas
        name: Generated schemas are current
        entry: uv run allyourbase schemas check
        language: system
        pass_filenames: false
        files: ^(schemas/|src/)

