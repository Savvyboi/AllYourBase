name: Offline checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra access --extra ingestion --extra review --extra monitor
      - run: uv run --locked --extra access --extra ingestion --extra review --extra monitor python scripts/check.py
      - run: uv run --locked --extra access --extra ingestion --extra review --extra monitor pre-commit run --all-files
